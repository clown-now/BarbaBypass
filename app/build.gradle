plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barbabypass.skip'
    compileSdk 34

    defaultConfig {
        applicationId "com.barbabypass.skip"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "BarbaBypass_v${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Xposed API from bundled jar (not bundled in final APK — use provided scope)
    compileOnly files('libs/xposed-api.jar')
}
