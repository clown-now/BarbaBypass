plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barbabypass.skip'
    compileSdk 34

    defaultConfig {
        applicationId "com.barbabypass.skip"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "BarbaBypass_v${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Xposed API — 编译时依赖，不打入 APK
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:constants:82'
}
